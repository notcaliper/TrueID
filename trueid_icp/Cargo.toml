[workspace]
members = [
    "src/identity",
    "src/professional", 
    "src/verification",
    "src/storage",
    "src/admin"
]

[workspace.dependencies]
ic-cdk = "0.10"
ic-cdk-macros = "0.7"
candid = "0.9"
serde = { version = "1.0", features = ["derive"] }
ic-stable-structures = "0.5"
sha2 = "0.10"
hex = "0.4"
time = "0.3"

[profile.release]
opt-level = 3
lto = true
strip = true
